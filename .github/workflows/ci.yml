name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Flutter CI — Lint, Analyze, Test
  # ═══════════════════════════════════════════════════════════════════════
  flutter-ci:
    name: "Flutter: Analyze & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run analyzer
        run: dart analyze --fatal-infos

      - name: Run build_runner (generate code)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test --exclude-tags=integration --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: flutter/coverage/lcov.info

  # ═══════════════════════════════════════════════════════════════════════
  # Flutter Integration Tests — Requires Supabase
  # ═══════════════════════════════════════════════════════════════════════
  flutter-integration:
    name: "Flutter: Integration Tests"
    runs-on: ubuntu-latest
    needs: [supabase-ci]
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: |
          cd ..
          supabase start

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run integration tests
        run: flutter test --tags=integration --concurrency=1
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL }}

  # ═══════════════════════════════════════════════════════════════════════
  # FastAPI CI — Lint, Type Check, Test
  # ═══════════════════════════════════════════════════════════════════════
  fastapi-ci:
    name: "FastAPI: Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=xml -v
        env:
          APP_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          JWT_SECRET: test-secret

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-coverage
          path: fastapi/coverage.xml

  # ═══════════════════════════════════════════════════════════════════════
  # Supabase CI — Validate Migrations & Types
  # ═══════════════════════════════════════════════════════════════════════
  supabase-ci:
    name: "Supabase: Migrations & Types"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: supabase db start

      - name: Verify migrations apply cleanly
        run: supabase db reset

      - name: Verify generated types are up to date
        run: |
          supabase gen types typescript --local > types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet types.gen.ts; then
            echo "::error::Generated types are not up to date. Run 'supabase gen types' and commit."
            git diff types.gen.ts
            exit 1
          fi
