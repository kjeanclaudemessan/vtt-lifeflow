name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Deploy Supabase Migrations to Staging
  # ═══════════════════════════════════════════════════════════════════════
  supabase-staging:
    name: "Supabase → Staging"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to staging project
        run: supabase link --project-ref ${{ secrets.STAGING_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations to staging
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

  # ═══════════════════════════════════════════════════════════════════════
  # Deploy FastAPI to Fly.io Staging
  # ═══════════════════════════════════════════════════════════════════════
  fastapi-staging:
    name: "FastAPI → Fly.io Staging"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io staging
        run: flyctl deploy --app lifeflow-api-staging --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # Build Flutter & Distribute Beta via Firebase
  # ═══════════════════════════════════════════════════════════════════════
  flutter-beta-android:
    name: "Flutter Android → Firebase"
    runs-on: ubuntu-latest
    needs: [supabase-staging]
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (staging)
        run: flutter build apk --release --dart-define=ENV=staging

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: internal-testers
          file: flutter/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

  flutter-beta-ios:
    name: "Flutter iOS → TestFlight"
    runs-on: macos-latest
    needs: [supabase-staging]
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/ios

      - name: Build & upload to TestFlight
        run: |
          cd ios
          bundle exec fastlane beta
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

  # ═══════════════════════════════════════════════════════════════════════
  # Notify team
  # ═══════════════════════════════════════════════════════════════════════
  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [supabase-staging, fastapi-staging, flutter-beta-android]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Supabase: ${{ needs.supabase-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- FastAPI: ${{ needs.fastapi-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Flutter Android: ${{ needs.flutter-beta-android.result }}" >> $GITHUB_STEP_SUMMARY
