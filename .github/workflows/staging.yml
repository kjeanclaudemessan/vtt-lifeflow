name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Deploy Supabase Migrations to Staging (Coolify VPS)
  # ═══════════════════════════════════════════════════════════════════════
  supabase-staging:
    name: "Supabase → Staging (Coolify)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to staging
        run: supabase db push --db-url "${{ secrets.STAGING_SUPABASE_DB_URL }}"
        env:
          PGSSLMODE: disable

  # ═══════════════════════════════════════════════════════════════════════
  # Deploy FastAPI to Coolify VPS (webhook trigger)
  # ═══════════════════════════════════════════════════════════════════════
  fastapi-staging:
    name: "FastAPI → Coolify Staging"
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify deploy via webhook
        run: |
          curl -f -s -X GET "${{ secrets.COOLIFY_WEBHOOK_STAGING_API }}" \
            || echo "::warning::Coolify webhook failed — deploy manually from Coolify dashboard"

  # ═══════════════════════════════════════════════════════════════════════
  # Build Flutter APK & upload as artifact + Firebase App Distribution
  # ═══════════════════════════════════════════════════════════════════════
  flutter-beta-android:
    name: "Flutter Android → APK"
    runs-on: ubuntu-latest
    needs: [supabase-staging]
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Signing setup ──────────────────────────────────────────────
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      # ── Build ──────────────────────────────────────────────────────
      - name: Build APK (staging)
        run: |
          flutter build apk --release \
            --dart-define=ENV=staging \
            --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE_URL=${{ vars.STAGING_API_BASE_URL }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Firebase App Distribution ──────────────────────────────────
      - name: Upload to Firebase App Distribution
        if: ${{ vars.ENABLE_FIREBASE_DISTRIBUTION == 'true' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: internal-testers
          file: flutter/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════
  # Build Flutter iOS (artifact only — TestFlight quand compte Apple dispo)
  # ═══════════════════════════════════════════════════════════════════════
  flutter-beta-ios:
    name: "Flutter iOS → Build"
    runs-on: macos-latest
    needs: [supabase-staging]
    if: ${{ vars.ENABLE_IOS_BUILD == 'true' }}
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ENV=staging \
            --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE_URL=${{ vars.STAGING_API_BASE_URL }}

      # TestFlight upload — activé quand les secrets Apple sont configurés
      - name: Setup Ruby & Fastlane
        if: false  # Skip until Apple secrets are configured
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/ios

      - name: Upload to TestFlight
        if: false  # Skip until Apple secrets are configured
        run: |
          cd ios
          bundle exec fastlane beta
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

  # ═══════════════════════════════════════════════════════════════════════
  # Notify team
  # ═══════════════════════════════════════════════════════════════════════
  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [supabase-staging, fastapi-staging, flutter-beta-android]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase | ${{ needs.supabase-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FastAPI | ${{ needs.fastapi-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter APK | ${{ needs.flutter-beta-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download APK from [Artifacts](../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
