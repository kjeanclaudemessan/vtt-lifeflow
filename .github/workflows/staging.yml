name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Deploy Supabase Migrations to Staging (Supabase Cloud)
  # ═══════════════════════════════════════════════════════════════════════
  supabase-staging:
    name: "Supabase → Staging (Cloud)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations to staging
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # Build Flutter APK & upload as artifact
  # ═══════════════════════════════════════════════════════════════════════
  flutter-beta-android:
    name: "Flutter Android → APK"
    runs-on: ubuntu-latest
    needs: [supabase-staging]
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Firebase config ──────────────────────────────────────────────
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      # ── Android Signing setup ────────────────────────────────────────
      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cat > android/app/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      # ── Build ──────────────────────────────────────────────────────
      - name: Build APK (staging)
        run: |
          flutter build apk --release \
            --dart-define=ENV=staging \
            --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} \
            --dart-define=POSTHOG_HOST=https://us.i.posthog.com

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # Build AAB & Deploy to Play Store Internal Track
  # ═══════════════════════════════════════════════════════════════════════
  flutter-playstore-staging:
    name: "Flutter Android → Play Store (Internal)"
    runs-on: ubuntu-latest
    needs: [supabase-staging, flutter-beta-android]
    if: ${{ vars.ENABLE_PLAYSTORE_STAGING == 'true' }}
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Firebase config ──────────────────────────────────────────────
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      # ── Android Signing setup ────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/app/key.properties << 'EOF'
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # ── Build AAB ──────────────────────────────────────────────────
      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=ENV=staging \
            --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} \
            --dart-define=POSTHOG_HOST=https://us.i.posthog.com

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-aab
          path: flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── Play Store upload via Fastlane ─────────────────────────────
      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/android

      - name: Decode Google Play service account key
        run: |
          echo "${{ secrets.ANDROID_GOOGLE_PLAY_SA_JSON }}" | base64 --decode > android/fastlane/google-play-key.json

      - name: Upload to Play Store (internal track)
        run: |
          cd android
          bundle exec fastlane internal
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: fastlane/google-play-key.json

  # ═══════════════════════════════════════════════════════════════════════
  # Build Flutter iOS (artifact only — TestFlight quand compte Apple dispo)
  # ═══════════════════════════════════════════════════════════════════════
  flutter-beta-ios:
    name: "Flutter iOS → Build"
    runs-on: macos-latest
    needs: [supabase-staging]
    if: ${{ vars.ENABLE_IOS_BUILD == 'true' }}
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Firebase config ──────────────────────────────────────────────
      - name: Decode GoogleService-Info.plist
        if: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ENV=staging \
            --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} \
            --dart-define=POSTHOG_HOST=https://us.i.posthog.com

      # TestFlight upload — activé quand les secrets Apple sont configurés
      - name: Setup Ruby & Fastlane
        if: false  # Skip until Apple secrets are configured
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/ios

      - name: Upload to TestFlight
        if: false  # Skip until Apple secrets are configured
        run: |
          cd ios
          bundle exec fastlane beta
        env:
          MATCH_GIT_URL: ${{ secrets.APPLE_MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.APPLE_MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPLE_APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPLE_APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APPLE_APPSTORE_API_KEY }}

  # ═══════════════════════════════════════════════════════════════════════
  # Notify team
  # ═══════════════════════════════════════════════════════════════════════
  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [supabase-staging, flutter-beta-android, flutter-playstore-staging]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase | ${{ needs.supabase-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter APK | ${{ needs.flutter-beta-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Play Store (Internal) | ${{ needs.flutter-playstore-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download APK from [Artifacts](../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
