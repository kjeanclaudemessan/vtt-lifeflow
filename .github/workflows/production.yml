name: Deploy Production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_stores:
        description: "Skip Store submission"
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Validate tag & version
  # ═══════════════════════════════════════════════════════════════════════
  validate:
    name: "Validate Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(echo $TAG | cut -d'+' -f1)
          BUILD=$(echo $TAG | cut -d'+' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD:-$GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "🏷️ Version: $VERSION+${BUILD:-$GITHUB_RUN_NUMBER}"

  # ═══════════════════════════════════════════════════════════════════════
  # Deploy Supabase Migrations to Production (Coolify VPS)
  # ═══════════════════════════════════════════════════════════════════════
  supabase-production:
    name: "Supabase → Production (Coolify)"
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to production
        run: supabase db push --db-url "${{ secrets.PROD_SUPABASE_DB_URL }}"
        env:
          PGSSLMODE: disable

  # ═══════════════════════════════════════════════════════════════════════
  # Deploy FastAPI to Coolify VPS (webhook trigger)
  # ═══════════════════════════════════════════════════════════════════════
  fastapi-production:
    name: "FastAPI → Coolify Production"
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Trigger Coolify deploy via webhook
        run: |
          curl -f -s -X GET "${{ secrets.COOLIFY_WEBHOOK_PROD_API }}" \
            || echo "::warning::Coolify webhook failed — deploy manually from Coolify dashboard"

  # ═══════════════════════════════════════════════════════════════════════
  # Build & Release Flutter Android → Play Store
  # ═══════════════════════════════════════════════════════════════════════
  flutter-android-release:
    name: "Flutter Android → Play Store"
    runs-on: ubuntu-latest
    needs: [validate, supabase-production]
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.validate.outputs.version }} \
            --build-number=${{ needs.validate.outputs.build_number }} \
            --dart-define=ENV=production \
            --dart-define=SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE_URL=${{ vars.PROD_API_BASE_URL }}
        env:
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Setup Ruby & Fastlane
        if: false  # Skip until Google Play secrets are configured
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/android

      - name: Upload to Play Store
        if: false  # Skip until Google Play secrets are configured
        run: |
          cd android
          bundle exec fastlane release
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Build APK (for direct install)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.validate.outputs.version }} \
            --build-number=${{ needs.validate.outputs.build_number }} \
            --dart-define=ENV=production \
            --dart-define=SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE_URL=${{ vars.PROD_API_BASE_URL }}
        env:
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════
  # Build & Release Flutter iOS → App Store (skipped until Apple account)
  # ═══════════════════════════════════════════════════════════════════════
  flutter-ios-release:
    name: "Flutter iOS → App Store"
    runs-on: macos-latest
    needs: [validate, supabase-production]
    if: ${{ vars.ENABLE_IOS_BUILD == 'true' }}
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=ENV=production

      - name: Setup Ruby & Fastlane
        if: false  # Skip until Apple secrets are configured
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: flutter/ios

      - name: Build & upload to App Store Connect
        if: false  # Skip until Apple secrets are configured
        run: |
          cd ios
          bundle exec fastlane release
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

  # ═══════════════════════════════════════════════════════════════════════
  # Shorebird OTA Patch (optional — activé quand SHOREBIRD_TOKEN configuré)
  # ═══════════════════════════════════════════════════════════════════════
  shorebird-patch:
    name: "Shorebird OTA Patch"
    runs-on: ubuntu-latest
    needs: [validate, flutter-android-release]
    if: ${{ vars.ENABLE_SHOREBIRD == 'true' }}
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: shorebirdtech/setup-shorebird@v1

      - name: Create patch
        run: shorebird patch android --release-version=${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # Create GitHub Release
  # ═══════════════════════════════════════════════════════════════════════
  github-release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [validate, flutter-android-release, fastapi-production, supabase-production]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          echo "## LifeFlow v${{ needs.validate.outputs.version }}" > release_notes.md
          echo "" >> release_notes.md
          git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~10)..HEAD >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}
          body_path: release_notes.md
          files: |
            artifacts/*.aab
            artifacts/*.apk
          generate_release_notes: true

  # ═══════════════════════════════════════════════════════════════════════
  # Notify
  # ═══════════════════════════════════════════════════════════════════════
  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [validate, supabase-production, fastapi-production, flutter-android-release]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Production Release v${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase | ${{ needs.supabase-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FastAPI | ${{ needs.fastapi-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.flutter-android-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download from [Artifacts](../actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
