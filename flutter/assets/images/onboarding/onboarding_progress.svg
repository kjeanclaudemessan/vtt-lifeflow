<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#0984E3" opacity="0.06"/>
  <circle cx="200" cy="200" r="140" fill="#0984E3" opacity="0.08"/>

  <!-- Main chart area -->
  <g transform="translate(60, 80)">
    <!-- Grid lines -->
    <line x1="30" y1="0" x2="30" y2="200" stroke="#DFE6E9" stroke-width="1"/>
    <line x1="30" y1="200" x2="280" y2="200" stroke="#DFE6E9" stroke-width="1"/>
    <line x1="30" y1="150" x2="280" y2="150" stroke="#DFE6E9" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="30" y1="100" x2="280" y2="100" stroke="#DFE6E9" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="30" y1="50" x2="280" y2="50" stroke="#DFE6E9" stroke-width="0.5" stroke-dasharray="4 4"/>

    <!-- Area fill -->
    <path d="M30 180 L72 160 L114 140 L156 120 L198 90 L240 60 L280 35 L280 200 L30 200Z" fill="url(#progressGrad)" opacity="0.3"/>

    <!-- Line chart -->
    <polyline points="30,180 72,160 114,140 156,120 198,90 240,60 280,35" stroke="#0984E3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Data points -->
    <circle cx="30" cy="180" r="5" fill="white" stroke="#0984E3" stroke-width="2.5"/>
    <circle cx="72" cy="160" r="5" fill="white" stroke="#0984E3" stroke-width="2.5"/>
    <circle cx="114" cy="140" r="5" fill="white" stroke="#0984E3" stroke-width="2.5"/>
    <circle cx="156" cy="120" r="5" fill="white" stroke="#0984E3" stroke-width="2.5"/>
    <circle cx="198" cy="90" r="5" fill="white" stroke="#0984E3" stroke-width="2.5"/>
    <circle cx="240" cy="60" r="6" fill="white" stroke="#0984E3" stroke-width="2.5"/>
    <circle cx="280" cy="35" r="7" fill="#0984E3" stroke="white" stroke-width="2.5"/>

    <!-- Current value label -->
    <rect x="258" y="10" rx="8" ry="8" width="50" height="22" fill="#0984E3"/>
    <text x="283" y="25" fill="white" font-size="11" text-anchor="middle" font-weight="600">91%</text>

    <!-- Week labels -->
    <text x="30" y="218" fill="#636E72" font-size="9" text-anchor="middle">S1</text>
    <text x="72" y="218" fill="#636E72" font-size="9" text-anchor="middle">S2</text>
    <text x="114" y="218" fill="#636E72" font-size="9" text-anchor="middle">S3</text>
    <text x="156" y="218" fill="#636E72" font-size="9" text-anchor="middle">S4</text>
    <text x="198" y="218" fill="#636E72" font-size="9" text-anchor="middle">S5</text>
    <text x="240" y="218" fill="#636E72" font-size="9" text-anchor="middle">S6</text>
    <text x="280" y="218" fill="#0984E3" font-size="9" text-anchor="middle" font-weight="700">S7</text>
  </g>

  <!-- Trophy icon at top -->
  <g transform="translate(175, 38)">
    <path d="M25 0 L15 0 L15 5 C5 5 0 10 0 18 C0 24 4 28 10 28 L12 28 C14 34 18 38 25 38 C32 38 36 34 38 28 L40 28 C46 28 50 24 50 18 C50 10 45 5 35 5 L35 0 Z" fill="#FECA57"/>
    <path d="M20 38 L20 45 L15 50 L35 50 L30 45 L30 38" fill="#FECA57"/>
    <rect x="12" y="50" width="26" height="4" rx="2" fill="#F39C12"/>
    <!-- Star on trophy -->
    <path d="M25 12 L27 18 L33 18 L28 22 L30 28 L25 24 L20 28 L22 22 L17 18 L23 18Z" fill="#F39C12" opacity="0.8"/>
  </g>

  <!-- Bottom streak badges -->
  <g transform="translate(70, 330)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="75" height="50" rx="12" fill="#6C5CE7" opacity="0.1"/>
    <text x="37" y="22" fill="#6C5CE7" font-size="18" text-anchor="middle">🔥</text>
    <text x="37" y="40" fill="#6C5CE7" font-size="11" text-anchor="middle" font-weight="700">23j</text>

    <!-- Badge 2 -->
    <rect x="90" y="0" width="75" height="50" rx="12" fill="#00B894" opacity="0.1"/>
    <text x="127" y="22" fill="#00B894" font-size="18" text-anchor="middle">⭐</text>
    <text x="127" y="40" fill="#00B894" font-size="11" text-anchor="middle" font-weight="700">Lvl 5</text>

    <!-- Badge 3 -->
    <rect x="180" y="0" width="75" height="50" rx="12" fill="#0984E3" opacity="0.1"/>
    <text x="217" y="22" fill="#0984E3" font-size="18" text-anchor="middle">📈</text>
    <text x="217" y="40" fill="#0984E3" font-size="11" text-anchor="middle" font-weight="700">+40%</text>
  </g>

  <!-- Floating elements -->
  <circle cx="50" cy="130" r="5" fill="#0984E3" opacity="0.3"/>
  <circle cx="350" cy="100" r="7" fill="#00B894" opacity="0.3"/>
  <circle cx="355" cy="280" r="4" fill="#6C5CE7" opacity="0.4"/>

  <!-- Small stars -->
  <path d="M340 160 L342 166 L348 166 L343 170 L345 176 L340 172 L335 176 L337 170 L332 166 L338 166Z" fill="#FECA57" opacity="0.5"/>
  <path d="M55 60 L57 64 L61 64 L58 67 L59 71 L55 68 L51 71 L52 67 L49 64 L53 64Z" fill="#FECA57" opacity="0.4"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0984E3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0984E3" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
