# flutter_launcher_icons configuration
# ═══════════════════════════════════════════════════════════════
# To generate icons:
#   1. Place your 1024x1024 PNG at assets/icon/app_icon.png
#   2. Run: dart run flutter_launcher_icons
#
# For adaptive icons (Android):
#   - Place foreground at assets/icon/app_icon_foreground.png (1024x1024, safe zone 66%)
#   - Background color or image is set below
#
# For web favicon:
#   - Automatically generated from the same source icon
# ═══════════════════════════════════════════════════════════════

flutter_launcher_icons:
  # Android
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

  # Android adaptive icon
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_monochrome: "assets/icon/app_icon.png"

  # iOS
  remove_alpha_ios: true

  # Web
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1A73E8"

  # Windows
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

  # macOS
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
