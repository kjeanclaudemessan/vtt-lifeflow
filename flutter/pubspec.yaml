name: lifeflow
description: Lifeflow Flutter application.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  connectivity_plus: ^7.0.0
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.8
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.2.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  google_fonts: ^7.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  moneroo_flutter_sdk: ^0.3.4
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.4
  posthog_flutter: ^5.0.0
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  supabase_flutter: ^2.12.0
  url_launcher: ^6.3.2
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.1.0
  patrol_finders:
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0
  json_serializable: ^6.8.0

flutter:
  generate: true
  uses-material-design: true

# ═══════════════════════════════════════════════════════════════════════
# Cider — Automated versioning
# https://pub.dev/packages/cider
# Usage: dart pub global run cider bump patch|minor|major
# ═══════════════════════════════════════════════════════════════════════
cider:
  changelog:
    path: ../CHANGELOG.md
    diff_link_template: "https://github.com/vitatech/lifeflow/compare/%from%...%to%"