# Release Workflow for Flutter Template
# Creates releases for Android, iOS, and Web
# Triggered manually or on version tags

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # PREPARE VERSION
  # ═══════════════════════════════════════════════════════════════════════════
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD ANDROID APK & AAB
  # ═══════════════════════════════════════════════════════════════════════════
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Run code generator
        run: dart run build_runner build --delete-conflicting-outputs

      # Setup Android signing if secrets are available
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        if: ${{ secrets.KEYSTORE_PASSWORD != '' }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD iOS
  # ═══════════════════════════════════════════════════════════════════════════
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Run code generator
        run: dart run build_runner build --delete-conflicting-outputs

      # For signed builds, add Apple certificate setup here
      # - name: Install Apple Certificate
      #   uses: apple-actions/import-codesign-certs@v2

      - name: Build iOS (No codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Create IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-release-unsigned.ipa
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD WEB
  # ═══════════════════════════════════════════════════════════════════════════
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Run code generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release

      - name: Create web archive
        run: |
          cd build/web
          zip -r ../../web-release.zip .
          cd ../..

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: web-release.zip
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # CREATE GITHUB RELEASE
  # ═══════════════════════════════════════════════════════════════════════════
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build-android, build-ios, build-web]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: artifacts/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/ios

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: artifacts/web

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mv artifacts/android/app-release.apk "artifacts/app-${VERSION}.apk"
          mv artifacts/android/app-release.aab "artifacts/app-${VERSION}.aab"
          mv artifacts/ios/app-release-unsigned.ipa "artifacts/app-${VERSION}-unsigned.ipa"
          mv artifacts/web/web-release.zip "artifacts/web-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ needs.prepare.outputs.version }}
          body: |
            ## Release v${{ needs.prepare.outputs.version }}

            ### Downloads
            - **Android APK**: `app-${{ needs.prepare.outputs.version }}.apk`
            - **Android AAB**: `app-${{ needs.prepare.outputs.version }}.aab`
            - **iOS IPA**: `app-${{ needs.prepare.outputs.version }}-unsigned.ipa` (requires signing)
            - **Web**: `web-${{ needs.prepare.outputs.version }}.zip`

            ${{ github.event.inputs.release_notes || '' }}
          files: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/*.ipa
            artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
