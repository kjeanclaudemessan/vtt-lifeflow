[project]
name = "lifeflow-tools"
version = "0.1.0"
description = "LifeFlow automation tools — Play Store assets, scripts, utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=11.0",
    "click>=8.1",
]

[project.scripts]
lifeflow = "lifeflow_tools.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeflow_tools"]

[tool.uv]
package = true
dev-dependencies = [
    "ruff>=0.9",
]
